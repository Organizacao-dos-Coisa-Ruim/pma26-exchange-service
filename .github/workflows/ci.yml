# CI/CD do exchange-service
#
# Todo push/PR: instala a interface pma:exchange e roda os testes (a API externa é mockada).
# Push na main: também publica a imagem no Docker Hub (<usuario>/exchange:latest e :<sha>),
# se os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN estiverem configurados na organização.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: exchange

jobs:
  build:
    name: Build, testes e imagem
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # interface de que o service depende (não está em nenhum repositório Maven público)
      - name: Checkout da interface exchange
        uses: actions/checkout@v4
        with:
          repository: Organizacao-dos-Coisa-Ruim/pma26-exchange
          path: .deps/exchange

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar interface
        run: mvn -B -q install -DskipTests -f .deps/exchange/pom.xml

      - name: Build e testes
        run: mvn -B verify

      - name: Login no Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:${{ github.sha }}
